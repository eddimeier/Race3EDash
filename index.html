<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceRoom Startaufstellung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px;
            color: #eee;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Filterbox nahtlos integriert */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto 30px auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a3a3a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .filter-item {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-item label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #95a5a6;
            font-weight: bold;
        }

        .filter-item select {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .filter-item select:focus {
            border-color: #e74c3c;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            height: 100%;
        }

        /* Versteckt Karten, die nicht zum Filter passen */
        .card.hidden {
            display: none !important;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(231, 76, 60, 0.2);
            border-color: #e74c3c;
        }

        .image-container {
            width: 100%;
            height: 180px;
            background-color: #111;
            border-bottom: 3px solid #e74c3c;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .fahrer-name {
            font-size: 1.4em;
            margin: 0 0 5px 0;
            color: #fff;
            font-weight: 700;
        }

        .team-name {
            font-size: 1em;
            color: #e74c3c;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        .car-name {
            font-size: 0.95em;
            color: #bbb;
            margin: 0 0 20px 0;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 6px;
        }

        .meta-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .klasse-tag {
            background-color: #34495e;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .livery-tag {
            font-size: 0.85em;
            color: #95a5a6;
            font-weight: 600;
            background: #111;
            padding: 4px 8px;
            border-radius: 4px;
        }

        #no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.2em;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <h1>RaceRoom Grid Dashboard</h1>
    
    <!-- Filterauswahl über den Karten -->
    <div class="filter-container">
        <div class="filter-item">
            <label for="filter-class">Klasse filtern</label>
            <select id="filter-class">
                <option value="all">Alle Klassen</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filter-brand">Manufaktur filtern</label>
            <select id="filter-brand">
                <option value="all">Alle Hersteller</option>
            </select>
        </div>
    </div>
    
    <div class="grid-container" id="cards-container">
        <p style="text-align: center; width: 100%;">Lade Fahrzeug- und Fahrerdaten aus der Simulation...</p>
    </div>

    <script>
        // Dieses Array merkt sich alle geladenen Karten für die Filterung
        let alleKartenDaten = [];

        async function ladeFahrzeugDaten() {
            const container = document.getElementById('cards-container');
            
            try {
                const response = await fetch('daten.json');
                if (!response.ok) throw new Error(`Fehler: ${response.status}`);
                
                const data = await response.json();
                container.innerHTML = ''; 
                
                // 1. Hier lesen wir die echten Klassennamen dynamisch aus deinem JSON aus
                const klassenMapping = {};
                const jsonKlassen = data.classes || data.Classes || {};
                Object.values(jsonKlassen).forEach(cls => {
                    const id = cls.Id || cls.id;
                    const name = cls.Name || cls.name || cls.IdName;
                    if (id && name) klassenMapping[id] = name;
                });

                // 2. Hier lesen wir die Hersteller aus, um "Aquila Aquila" Dopplungen zu vermeiden
                const herstellerMapping = {};
                const jsonHersteller = data.manufactures || data.manufacturers || {};
                Object.values(jsonHersteller).forEach(man => {
                    const id = man.Id || man.id;
                    const name = man.Name || man.name;
                    if (id && name) herstellerMapping[id] = name;
                });
                
                const alleAutos = Object.values(data.cars || {});
                
                // Speicherboxen, um Duplikate in den Listen zu verhindern
                const verfuegbareKlassen = new Set();
                const verfuegbareHersteller = new Set();
                
                alleAutos.forEach(car => {
                    if (!car || !car.liveries) return;
                    
                    // Holt den echten Namen aus der JSON-Liste, Fallback ist die ID
                    const klasseText = klassenMapping[car.Class] || "Klasse " + car.Class;
                    const herstellerText = herstellerMapping[car.CarManufacturer] || car.BrandName || "Unbekannt";
                    
                    // Werte für die Menüs sammeln
                    verfuegbareKlassen.add(klasseText);
                    verfuegbareHersteller.add(herstellerText);
                    
                    car.liveries.forEach(livery => {
                        if (!livery || !livery.drivers) return;
                        
                        livery.drivers.forEach(driver => {
                            const card = document.createElement('div');
                            card.className = 'card';
                            
                            // Die funktionierende Bild-URL
                            const bildPfad = "https://game.raceroom.com/store/image_redirect?id=" + livery.Id + "&size=small"; 
                            
                            // Saubere Zusammenführung des Autonamens
                            const fahrzeugName = (car.Name && car.Name.startsWith(herstellerText)) 
                                ? car.Name 
                                : herstellerText + " " + (car.Name || "");
                            
                            card.innerHTML = `
                                <div class="image-container">
                                    <img src="${bildPfad}" alt="${fahrzeugName}">
                                </div>
                                <div class="card-content">
                                    <div>
                                        <h2 class="fahrer-name">${driver.Forename} ${driver.Surname}</h2>
                                        <p class="team-name">${livery.TeamName || 'Privatfahrer'}</p>
                                        <div class="car-name">🏎️ ${fahrzeugName}</div>
                                    </div>
                                    <div class="meta-container">
                                        <span class="klasse-tag">${klasseText}</span>
                                        <span class="livery-tag">Startnummer: ${livery.Name}</span>
                                    </div>
                                </div>
                            `;
                            
                            container.appendChild(card);

                            // Karte im Filter-Speicher registrieren
                            alleKartenDaten.push({
                                element: card,
