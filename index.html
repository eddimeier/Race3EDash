<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceRoom Startaufstellung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px;
            color: #eee;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Container für die Logo-Filter */
        .logo-filter-section {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #3a3a3a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .filter-heading {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #95a5a6;
            font-weight: bold;
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .logo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* Die klickbaren Logo-Buttons */
        .logo-btn {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            min-width: 80px;
            height: 45px;
        }

        .logo-btn img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: brightness(0.9) invert(0); /* Für helle Logos auf dunklem Grund */
        }

        .logo-btn:hover {
            border-color: #e74c3c;
            background: #222;
        }

        /* Status wenn ein Logo ausgewählt ist */
        .logo-btn.active {
            border-color: #e74c3c;
            background: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
        }
        
        .logo-btn.active img {
            filter: brightness(1) invert(1); /* Invertiert Logo-Farbe auf rotem Grund */
        }

        .logo-btn.all-btn {
            color: #fff;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        /* Grid für die Auto-Karten */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            height: 100%;
        }

        .card.hidden {
            display: none !important;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(231, 76, 60, 0.2);
            border-color: #e74c3c;
        }

        .image-container {
            width: 100%;
            height: 180px;
            background-color: #111;
            border-bottom: 3px solid #e74c3c;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .fahrer-name {
            font-size: 1.4em;
            margin: 0 0 5px 0;
            color: #fff;
            font-weight: 700;
        }

        .team-name {
            font-size: 1em;
            color: #e74c3c;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        .car-name {
            font-size: 0.95em;
            color: #bbb;
            margin: 0 0 20px 0;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 6px;
        }

        .meta-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .klasse-tag {
            background-color: #34495e;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Kleines Logo direkt auf dem Karten-Tag */
        .mini-logo {
            height: 12px;
            width: auto;
            object-fit: contain;
            filter: brightness(1) invert(1);
        }

        .livery-tag {
            font-size: 0.85em;
            color: #95a5a6;
            font-weight: 600;
            background: #111;
            padding: 4px 8px;
            border-radius: 4px;
        }

        #no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.2em;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <h1>RaceRoom Grid Dashboard</h1>
    
    <!-- Visuelle Logo-Filterleiste -->
    <div class="logo-filter-section">
        <div class="filter-heading">Nach Klasse filtern</div>
        <div class="logo-grid" id="class-logo-grid">
            <button class="logo-btn all-btn active" data-filter="all" data-type="class">Alle Klassen</button>
        </div>

        <div class="filter-heading" id="manufacturer-heading">Nach Manufaktur filtern</div>
        <div class="logo-grid" id="brand-logo-grid">
            <button class="logo-btn all-btn active" data-filter="all" data-type="brand">Alle Marken</button>
        </div>
    </div>
    
    <div class="grid-container" id="cards-container">
        <p style="text-align: center; width: 100%;">Lade Fahrzeug- und Fahrerdaten aus der Simulation...</p>
    </div>

    <script>
        let alleKartenDaten = [];
        let aktiverKlassenFilter = "all";
        let aktiverMarkenFilter = "all";

        async function ladeFahrzeugDaten() {
            const container = document.getElementById('cards-container');
            
            try {
                const response = await fetch('daten.json');
                if (!response.ok) throw new Error(`Fehler: ${response.status}`);
                
                const data = await response.json();
                container.innerHTML = ''; 
                
                // Klarnamen-Mappings (falls sie funktionieren)
                const klassenMapping = {};
                const jsonKlassen = data.classes || data.Classes || {};
                Object.values(jsonKlassen).forEach(cls => {
                    const id = cls.Id || cls.id;
                    const name = cls.Name || cls.name || cls.IdName;
                    if (id && name) klassenMapping[id] = name;
                });

                const herstellerMapping = {};
                const jsonHersteller = data.manufactures || data.manufacturers || {};
                Object.values(jsonHersteller).forEach(man => {
                    const id = man.Id || man.id;
                    const name = man.Name || man.name;
                    if (id && name) herstellerMapping[id] = name;
                });
                
                const alleAutos = Object.values(data.cars || {});
                
                // Sets für die IDs, um die Logos oben zu generieren
                const klassenIds = new Set();
                const herstellerIds = new Set();
                
                alleAutos.forEach(car => {
                    if (!car || !car.liveries) return;
                    
                    const klasseText = klassenMapping[car.Class] || "Klasse " + car.Class;
                    const herstellerText = herstellerMapping[car.CarManufacturer] || car.BrandName || "";
                    
                    // IDs für die Logo-Leisten sammeln
                    klassenIds.add(car.Class);
                    if (car.CarManufacturer) herstellerIds.add(car.CarManufacturer);
                    
                    car.liveries.forEach(livery => {
                        if (!livery || !livery.drivers) return;
                        
                        livery.drivers.forEach(driver => {
                            const card = document.createElement('div');
                            card.className = 'card';
                            
                            const bildPfad = "https://raceroom.com" + livery.Id + "&size=small"; 
                            
                            // Offizielle Logo-Links von den RaceRoom-Servern anhand der IDs generiert
                            const klasseLogoUrl = "https://raceroom.com" + car.Class + "&size=small";
                            
                            const fahrzeugName = (car.Name && car.Name.startsWith(herstellerText)) 
                                ? car.Name 
                                : herstellerText + " " + (car.Name || "");
                            
                            card.innerHTML = `
                                <div class="image-container">
                                    <img src="${bildPfad}" alt="${fahrzeugName}">
                                </div>
