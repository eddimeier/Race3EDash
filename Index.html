<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceRoom Fahrzeug-Filter</title>
    <!-- Google Fonts für den sportlichen Rennsport-Look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #2c3038;
            --panel-bg: #1a1d24;
            --panel-border: #2a2f3a;
            --raceroom-red: #e30613;
            --raceroom-red-hover: #ff1e2b;
            --text-main: #ffffff;
            --text-muted: #b8bbbf;
	    --text-specs: #d7d9db;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0; 
            padding: 30px; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            background-image: radial-gradient(circle at top right, rgba(227, 6, 19, 0.05), transparent 60%);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--text-main);
            border-left: 5px solid var(--raceroom-red);
            padding-left: 15px;
            display: inline-block;
        }

        /* FILTERBEREICH */
        .filter-section { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            background: var(--panel-bg); 
            padding: 20px; 
            border-radius: 4px; 
            border: 1px solid var(--panel-border);
            border-bottom: 3px solid var(--panel-border);
            position: relative;
        }

        /* Schräge Zierlinie im R3E-Stil */
        .filter-section::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 80px;
            height: 3px;
            background: var(--raceroom-red);
        }

        .filter-section label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            max-width: 300px;
        }

        select { 
            padding: 10px 15px; 
            border-radius: 4px; 
            border: 1px solid var(--panel-border); 
            background-color: #242933;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: calc(100% - 10px) center;
        }

        select:focus, select:hover {
            border-color: var(--raceroom-red);
            box-shadow: 0 0 8px rgba(227, 6, 19, 0.3);
        }

        /* FAHRZEUG-GRID */
        .car-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
        }

        .car-card { 
            background: var(--panel-bg); 
            padding: 0; 
            border-radius: 4px; 
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: var(--raceroom-red);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(227, 6, 19, 0.15);
        }

        /* Container für das spätere Bild */
        .car-image-placeholder {
            width: 100%;
            height: 160px;
            background: #242933;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--panel-border);
            color: #3d4554;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        /* Karten-Inhalt */
        .car-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-card h3 { 
            margin: 0 0 15px 0; 
            color: var(--text-main); 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .tag { 
            display: inline-block; 
            background: #242933; 
            color: var(--text-muted);
            padding: 4px 10px; 
            border-radius: 3px; 
            font-size: 13px; 
            font-weight: 600;
            text-transform: uppercase;
            border: 1px solid var(--panel-border);
            letter-spacing: 0.5px;
        }

        .tag.class-tag {
            border-left: 3px solid var(--raceroom-red);
            color: var(--text-main);
        }
/* Styling für die CSV-Specs (Nation, Motor etc.) */
.car-specs, 
.car-specs li, 
.car-specs p, 
.car-specs div {
    color: var(--raceroom-red) !important;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    list-style: none; /* Entfernt Aufzählungspunkte, falls es eine Liste ist */
    padding: 0;
}
/* Repariert die dunkle Schriftfarbe der CSV-Eigenschaften */
.car-info, 
.car-info div, 
.car-info p,
.car-info span:not(.tag) {
    color: var(--text-muted) !important;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
}

/* Sorgt dafür, dass die Überschrift (z.B. Porsche) trotzdem weiß bleibt */
.car-info h3 {
    color: var(--text-specs) !important;
}
    </style>
</head>
<body>

    <h1>RaceRoom Grid</h1>

    <!-- FILTERBEREICH -->
    <div class="filter-section">
        <label>Klasse
            <select id="filter-class">
                <option value="all">Alle Klassen</option>
                <option value="gt3">GT3 Masters</option>
                <option value="dtm">DTM 2026</option>
                <option value="wtcr">WTCR</option>
            </select>
        </label>
        
        <label>Hersteller (Brand)
            <select id="filter-brand">
                <option value="all">Alle Hersteller</option>
                <option value="audi">Audi</option>
                <option value="bmw">BMW</option>
                <option value="porsche">Porsche</option>
            </select>
        </label>
    </div>

    <!-- ERGEBNISSE -->
    <div class="car-grid" id="car-container">
        
        <!-- Beispiel-Karte zur Vorschau des Designs -->
        <div class="car-card">
            <div class="car-image-placeholder">[ Fahrzeug-Bild ]</div>
            <div class="car-info">
                <h3>Porsche 911 GT3 R</h3>
                <div class="tag-container">
                    <span class="tag class-tag">GT3 Masters</span>
                    <span class="tag">Porsche</span>
                </div>
            </div>
        </div>

        <div class="car-card">
            <div class="car-image-placeholder">[ Fahrzeug-Bild ]</div>
            <div class="car-info">
                <h3>BMW M4 DTM</h3>
                <div class="tag-container">
                    <span class="tag class-tag">DTM</span>
                    <span class="tag">BMW</span>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
